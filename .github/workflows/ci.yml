# CI — build, typecheck, forbidden-imports, npm audit, E2E (Playwright)
# Master Report 2025-03-03: harden CI with audit + E2E; do not log E2E secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build admin-ui
        run: npm run build -w @sline/admin-ui

      - name: Typecheck admin-ui
        run: npm run typecheck -w @sline/admin-ui

      - name: Typecheck api
        run: npm run typecheck -w @sline/api

      - name: Forbidden-imports scan (admin-ui)
        run: npm run forbidden-imports -w @sline/admin-ui

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-audit
    env:
      # Do not log or echo these. Use GitHub secrets (e.g. E2E_USER_EMAIL, E2E_USER_PASSWORD) when needed.
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/admin-ui

      - name: Run Playwright E2E
        run: npm run test:e2e -w @sline/admin-ui
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin-ui/playwright-report/
          retention-days: 7

      - name: Upload test-results (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/admin-ui/test-results/
          retention-days: 7
